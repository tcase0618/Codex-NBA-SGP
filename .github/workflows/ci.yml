name: NBA engine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: python -m pip install -e ".[test]"
      - name: Test source, forecasts and research selection
        run: python -m pytest -q
      - name: Check JavaScript
        run: node --check nba_quant/static/app.js
      - name: Check dashboard behavior with isolated fixtures
        run: python scripts/check_dashboard.py
