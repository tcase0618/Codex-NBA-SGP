[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "case-capital-nba-quant"
version = "0.1.0"
description = "Source-aware NBA research and coherent possession simulation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3", "pydantic>=2.8,<3", "tzdata>=2025.2; platform_system == 'Windows'"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "scipy>=1.11,<2"]
ml = ["autogluon.tabular[lightgbm]==1.6.3", "xgboost==3.2.0", "psutil>=5.9,<8"]
reports = ["reportlab==5.0.1", "pypdf==6.16.2", "scipy>=1.11,<2"]

[project.scripts]
nba-quant = "nba_quant.cli:main"

[tool.setuptools.package-data]
nba_quant = ["static/*", "metric_catalog.json"]

[tool.setuptools.packages.find]
include = ["nba_quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
